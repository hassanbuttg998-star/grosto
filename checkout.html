<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout &#8212; GROSTO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button, a, input, select, textarea {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus, a:focus {
      outline: none;
    }

    :root {
      --green: #1EAF59;
      --yellow: #FFB300;
      --light-green: #E8F5EC;
      --gray: #666;
      --border: #E2E5E3;
      --light: #F7F8F7;
      --red: #E53935;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
      padding-bottom: 40px;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .header {
      max-width: 1100px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--green);
    }

    .logo span {
      color: var(--yellow);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .intro {
      color: var(--gray);
      margin-bottom: 30px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 25px;
      align-items: start;
    }

    .box {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .box h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #D8DCDA;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--green);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .payment-option {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
    }

    .payment-option input {
      width: auto;
      margin-top: 4px;
    }

    .payment-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .payment-description {
      color: var(--gray);
      font-size: 13px;
    }

    .payment-details {
      display: none;
      background: var(--light);
      border-radius: 12px;
      padding: 16px;
      margin: -4px 0 12px;
      font-size: 14px;
    }

    .payment-details.show {
      display: block;
    }

    .payment-details .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .payment-details .row:last-child {
      border-bottom: none;
    }

    .summary {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      position: sticky;
      top: 20px;
    }

    .summary h2 {
      margin-bottom: 20px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .total {
      border-top: 1px solid var(--border);
      margin-top: 15px;
      padding-top: 18px;
      font-size: 20px;
      font-weight: 900;
    }

    .place-order {
      width: 100%;
      border: none;
      background: var(--green);
      color: white;
      padding: 16px;
      border-radius: 11px;
      font-size: 17px;
      font-weight: 900;
      margin-top: 22px;
      cursor: pointer;
    }

    .place-order:hover {
      background: #178e48;
    }

    .place-order:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .min-order-warning {
      margin: 16px 0 0;
      padding: 12px;
      border-radius: 10px;
      background: #FFF3E0;
      color: #E65100;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .delivery-area-note {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      display: none;
    }

    .delivery-area-note.ok {
      display: block;
      background: var(--light-green);
      color: #178e48;
    }

    .delivery-area-note.blocked {
      display: block;
      background: #FDECEC;
      color: var(--red);
    }

    .secure {
      margin-top: 15px;
      padding: 12px;
      background: var(--light-green);
      border-radius: 10px;
      font-size: 13px;
      color: #28613d;
      text-align: center;
    }

    .required {
      color: var(--red);
    }

    @media (max-width: 750px) {

      .header {
        padding: 13px 15px;
      }

      .logo {
        font-size: 26px;
      }

      .container {
        padding: 25px 14px;
      }

      h1 {
        font-size: 28px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header">

    <a href="index.html" class="logo">
      GROST<span>O</span>
    </a>

  </div>

</header>


<main class="container">

  <h1>Checkout</h1>

  <p class="intro">
    Apni delivery details enter karein aur order place karein.
  </p>


  <div class="layout">


    <!-- CUSTOMER DETAILS -->

    <div>

      <div class="box">

        <h2>&#128205; Delivery Details</h2>

        <div class="field">

          <label>
            Full Name <span class="required">*</span>
          </label>

          <input
            type="text"
            id="name"
            placeholder="Aapka naam"
            required
          >

        </div>


        <div class="field">

          <label>
            Phone / WhatsApp <span class="required">*</span>
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="03XX XXXXXXX"
            required
          >

        </div>


        <div class="field">

          <label>
            City <span class="required">*</span>
          </label>

          <select id="city" onchange="checkDeliveryCity()">
            <option value="">Select City</option>
          </select>

          <div class="delivery-area-note" id="deliveryAreaNote"></div>

        </div>


        <div class="field">

          <label>
            Complete Address <span class="required">*</span>
          </label>

          <textarea
            id="address"
            placeholder="House no, street, area, landmark..."
          ></textarea>

        </div>


        <div class="field">

          <label>
            Delivery Instructions
          </label>

          <textarea
            id="instructions"
            placeholder="Optional &#8212; e.g. gate par call karein"
          ></textarea>

        </div>

      </div>


      <!-- PAYMENT -->

      <div class="box">

        <h2>&#128179; Payment Method</h2>


        <label class="payment-option">

          <input
            type="radio"
            name="payment"
            value="cod"
            checked
            onchange="updatePaymentView()"
          >

          <div>

            <div class="payment-title">
              Cash on Delivery
            </div>

            <div class="payment-description">
              Order receive karte waqt cash payment karein.
            </div>

          </div>

        </label>


        <label class="payment-option">

          <input
            type="radio"
            name="payment"
            value="easypaisa"
            onchange="updatePaymentView()"
          >

          <div style="flex:1;">

            <div class="payment-title">
              EasyPaisa
            </div>

            <div class="payment-description">
              Neeche diye gaye account par payment bhejein.
            </div>

          </div>

        </label>

        <div class="payment-details" id="easypaisaDetails">

          <div class="row">
            <span>Account Title</span>
            <strong id="epTitle">&#8212;</strong>
          </div>

          <div class="row">
            <span>Account Number</span>
            <strong id="epNumber">&#8212;</strong>
          </div>

        </div>


        <label class="payment-option">

          <input
            type="radio"
            name="payment"
            value="jazzcash"
            onchange="updatePaymentView()"
          >

          <div style="flex:1;">

            <div class="payment-title">
              JazzCash
            </div>

            <div class="payment-description">
              Neeche diye gaye account par payment bhejein.
            </div>

          </div>

        </label>

        <div class="payment-details" id="jazzcashDetails">

          <div class="row">
            <span>Account Title</span>
            <strong id="jcTitle">&#8212;</strong>
          </div>

          <div class="row">
            <span>Account Number</span>
            <strong id="jcNumber">&#8212;</strong>
          </div>

        </div>


        <div class="field" id="tidField" style="display:none; margin-top: 5px;">

          <label>
            Transaction ID (TID) <span class="required">*</span>
          </label>

          <input
            type="text"
            id="paymentTid"
            placeholder="Payment karne ke baad TID yahan likhein"
          >

        </div>

      </div>

    </div>


    <!-- ORDER SUMMARY -->

    <aside class="summary">

      <h2>Order Summary</h2>

      <div id="summaryItems"></div>


      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <strong id="subtotal">
          Rs. 0
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Delivery
        </span>

        <strong id="deliveryFeeDisplay">
          Rs. 100
        </strong>

      </div>


      <div class="summary-row total">

        <span>
          Total
        </span>

        <span id="total">
          Rs. 0
        </span>

      </div>

      <div class="min-order-warning" id="minOrderWarning" style="display:none;"></div>

      <button
        class="place-order"
        id="placeOrderBtn"
        onclick="placeOrder()"
      >
        Place Order &#8594;
      </button>


      <div class="secure">
        &#128274; Your order details are handled securely.
      </div>

    </aside>

  </div>

</main>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/site-extras.js"></script>

<script>

  let cart =
    JSON.parse(
      localStorage.getItem("grostoCart")
    ) || [];

  let grostoSettings = {};

  let deliveryFee = 100;

  let minOrder = 1000;


  function renderSummary() {

    const container =
      document.getElementById("summaryItems");

    let subtotal = 0;

    container.innerHTML = "";


    cart.forEach(item => {

      const itemTotal =
        item.price * item.quantity;

      subtotal += itemTotal;


      const div =
        document.createElement("div");

      div.className = "summary-item";

      div.innerHTML = `

        <span>
          ${item.name} \u00d7 ${item.quantity}
        </span>

        <strong>
          Rs. ${itemTotal}
        </strong>

      `;

      container.appendChild(div);

    });


    document.getElementById("subtotal")
      .textContent = "Rs. " + subtotal;

    document.getElementById("deliveryFeeDisplay")
      .textContent = subtotal > 0 ? "Rs. " + deliveryFee : "Rs. 0";

    const total = subtotal + (subtotal > 0 ? deliveryFee : 0);

    document.getElementById("total")
      .textContent = "Rs. " + total;

    const warningBox = document.getElementById("minOrderWarning");

    if (subtotal > 0 && subtotal < minOrder) {

      const remaining = minOrder - subtotal;

      warningBox.style.display = "block";

      warningBox.textContent =
        "Minimum order Rs. " + minOrder + " hai. Aapko Rs. " + remaining + " ka aur samaan lena hoga.";

      minOrderOk = false;

    } else {

      warningBox.style.display = "none";

      minOrderOk = true;
    }

    updatePlaceButtonState();

  }


  /* ================= SHOW PAYMENT DETAILS BASED ON SELECTION ================= */

  function updatePaymentView() {

    const payment =
      document.querySelector('input[name="payment"]:checked').value;

    document.getElementById("easypaisaDetails")
      .classList.toggle("show", payment === "easypaisa");

    document.getElementById("jazzcashDetails")
      .classList.toggle("show", payment === "jazzcash");

    document.getElementById("tidField").style.display =
      (payment === "easypaisa" || payment === "jazzcash") ? "block" : "none";

  }


  /* ================= LOAD PAYMENT + WHATSAPP SETTINGS ================= */

  async function loadSettings() {

    grostoSettings = await getGrostoSettings();

    document.getElementById("epTitle").textContent =
      grostoSettings.easypaisa_title || "Not set yet";

    document.getElementById("epNumber").textContent =
      grostoSettings.easypaisa_number || "Not set yet";

    document.getElementById("jcTitle").textContent =
      grostoSettings.jazzcash_title || "Not set yet";

    document.getElementById("jcNumber").textContent =
      grostoSettings.jazzcash_number || "Not set yet";

    deliveryFee = Number(grostoSettings.delivery_fee) || 100;

    minOrder = Number(grostoSettings.min_order) || 1000;

    deliverableCities = (grostoSettings.delivery_city || "Gujrat")
      .split(",")
      .map(c => c.trim())
      .filter(Boolean);

    populateCitySelect();

    renderSummary();

  }

  const ALL_PAKISTAN_CITIES = [
    "Gujrat", "Lahore", "Karachi", "Islamabad", "Rawalpindi",
    "Faisalabad", "Multan", "Gujranwala", "Sialkot", "Peshawar",
    "Sargodha", "Jhelum", "Sheikhupura", "Other"
  ];

  let deliverableCities = ["Gujrat"];

  function populateCitySelect() {

    const select = document.getElementById("city");

    const currentValue = select.value;

    // deliverable cities first, then the rest (shown but not selectable)
    const rest = ALL_PAKISTAN_CITIES.filter(c => !deliverableCities.includes(c));

    const options = ['<option value="">Select City</option>'];

    deliverableCities.forEach(c => {
      options.push('<option value="' + c + '">' + c + '</option>');
    });

    rest.forEach(c => {
      options.push('<option value="' + c + '">' + c + ' (Jald Available)</option>');
    });

    select.innerHTML = options.join("");

    if (currentValue) select.value = currentValue;

    checkDeliveryCity();
  }

  let minOrderOk = true;

  let cityOk = false;

  function updatePlaceButtonState() {

    document.getElementById("placeOrderBtn").disabled = !(minOrderOk && cityOk);
  }

  function checkDeliveryCity() {

    const city = document.getElementById("city").value;

    const note = document.getElementById("deliveryAreaNote");

    if (!city) {

      note.className = "delivery-area-note";

      note.textContent = "";

      cityOk = false;

      updatePlaceButtonState();

      return;
    }

    if (deliverableCities.includes(city)) {

      note.className = "delivery-area-note ok";

      note.textContent = "Delivery available hai " + city + " mein.";

      cityOk = true;

    } else {

      note.className = "delivery-area-note blocked";

      note.textContent =
        "Maazrat, abhi sirf " + deliverableCities.join(", ") +
        " mein delivery available hai. " + city + " jald add hoga.";

      cityOk = false;
    }

    updatePlaceButtonState();
  }


  /* ================= PLACE ORDER ================= */

  async function placeOrder() {

    if (cart.length === 0) {

      alert(
        "Aapka cart empty hai. Pehle products add karein."
      );

      window.location.href = "shop.html";

      return;
    }


    const name =
      document.getElementById("name").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const city =
      document.getElementById("city").value;

    const address =
      document.getElementById("address").value.trim();

    const instructions =
      document.getElementById("instructions").value.trim();


    if (!name || !phone || !city || !address) {

      alert(
        "Please apni required delivery details complete karein."
      );

      return;
    }

    if (!deliverableCities.includes(city)) {

      alert(
        "Maazrat, abhi sirf " + deliverableCities.join(", ") + " mein delivery available hai."
      );

      return;
    }


    const payment =
      document.querySelector(
        'input[name="payment"]:checked'
      ).value;

    const paymentTid =
      document.getElementById("paymentTid").value.trim();

    if ((payment === "easypaisa" || payment === "jazzcash") && !paymentTid) {

      alert("Please payment ka Transaction ID (TID) enter karein.");

      return;
    }


    const orderNumber =
      "GR" +
      Date.now().toString().slice(-8);

    const subtotal = cart.reduce(
      (sum, item) =>
        sum + (item.price * item.quantity),
      0
    );

    if (subtotal < minOrder) {

      alert(
        "Minimum order Rs. " + minOrder + " hai. Aapko Rs. " +
        (minOrder - subtotal) + " ka aur samaan lena hoga."
      );

      return;
    }

    const total = subtotal + deliveryFee;

    const order = {

      orderNumber: orderNumber,

      customer: {
        name: name,
        phone: phone,
        city: city,
        address: address,
        instructions: instructions
      },

      payment: payment,
      paymentTid: paymentTid || null,

      items: cart,

      subtotal: subtotal,

      deliveryFee: deliveryFee,

      total: total,

      status: "Pending",

      createdAt:
        new Date().toISOString()

    };


    const placeBtn = document.getElementById("placeOrderBtn");

    placeBtn.disabled = true;

    placeBtn.textContent = "Order place ho raha hai...";


    // 1. Save order to database
    const { error: orderError } = await grostoDB.from("orders").insert({
      order_number: orderNumber,
      customer_name: name,
      phone: phone,
      city: city,
      address: address,
      instructions: instructions || null,
      payment_method: payment,
      payment_tid: paymentTid || null,
      items: cart,
      subtotal: subtotal,
      delivery_fee: deliveryFee,
      total: total,
      status: "Pending"
    });

    if (orderError) {

      console.error(orderError);

      alert("Order save nahi ho saka. Dobara try karein.");

      placeBtn.disabled = false;

      placeBtn.textContent = "Place Order \u2192";

      return;
    }


    // 2. Reduce stock for each item (best-effort)
    for (const item of cart) {

      if (!item.id) continue;

      const { data: productRow } = await grostoDB
        .from("products")
        .select("stock")
        .eq("id", item.id)
        .single();

      if (productRow) {

        const newStock = Math.max(0, productRow.stock - item.quantity);

        await grostoDB
          .from("products")
          .update({ stock: newStock })
          .eq("id", item.id);
      }
    }


    // 3. Save locally for order-success page
    localStorage.setItem(
      "grostoLastOrder",
      JSON.stringify(order)
    );

    localStorage.removeItem("grostoCart");


    // 4. Redirect to success page
    // (Order is already saved to the database / Admin Panel above.
    //  WhatsApp is offered only as an optional support button on that page.)
    window.location.href =
      "order-success.html";

  }


  /* ================= START ================= */

  if (typeof applySiteLogo === "function") applySiteLogo();
  renderSummary();
  loadSettings();
  updatePaymentView();

</script>

</body>
</html>
