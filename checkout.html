<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout — GROSTO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #1EAF59;
      --yellow: #FFB300;
      --light-green: #E8F5EC;
      --gray: #666;
      --border: #E2E5E3;
      --light: #F7F8F7;
      --red: #E53935;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
      padding-bottom: 40px;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .header {
      max-width: 1100px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--green);
    }

    .logo span {
      color: var(--yellow);
    }

    .back {
      color: var(--green);
      font-weight: 800;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .intro {
      color: var(--gray);
      margin-bottom: 30px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 25px;
      align-items: start;
    }

    .box {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .box h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #D8DCDA;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--green);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .payment-option {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
    }

    .payment-option input {
      width: auto;
      margin-top: 4px;
    }

    .payment-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .payment-description {
      color: var(--gray);
      font-size: 13px;
    }

    .summary {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      position: sticky;
      top: 20px;
    }

    .summary h2 {
      margin-bottom: 20px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .total {
      border-top: 1px solid var(--border);
      margin-top: 15px;
      padding-top: 18px;
      font-size: 20px;
      font-weight: 900;
    }

    .place-order {
      width: 100%;
      border: none;
      background: var(--green);
      color: white;
      padding: 16px;
      border-radius: 11px;
      font-size: 17px;
      font-weight: 900;
      margin-top: 22px;
      cursor: pointer;
    }

    .place-order:hover {
      background: #178e48;
    }

    .secure {
      margin-top: 15px;
      padding: 12px;
      background: var(--light-green);
      border-radius: 10px;
      font-size: 13px;
      color: #28613d;
      text-align: center;
    }

    .required {
      color: var(--red);
    }

    @media (max-width: 750px) {

      .header {
        padding: 13px 15px;
      }

      .logo {
        font-size: 26px;
      }

      .back {
        font-size: 14px;
      }

      .container {
        padding: 25px 14px;
      }

      h1 {
        font-size: 28px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
        order: -1;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header">

    <a href="index.html" class="logo">
      GROST<span>O</span>
    </a>

    <a href="cart.html" class="back">
      ← Back to Cart
    </a>

  </div>

</header>


<main class="container">

  <h1>Checkout</h1>

  <p class="intro">
    Apni delivery details enter karein aur order place karein.
  </p>


  <div class="layout">


    <!-- CUSTOMER DETAILS -->

    <div>

      <div class="box">

        <h2>📍 Delivery Details</h2>

        <div class="field">

          <label>
            Full Name <span class="required">*</span>
          </label>

          <input
            type="text"
            id="name"
            placeholder="Aapka naam"
            required
          >

        </div>


        <div class="field">

          <label>
            Phone / WhatsApp <span class="required">*</span>
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="03XX XXXXXXX"
            required
          >

        </div>


        <div class="field">

          <label>
            City <span class="required">*</span>
          </label>

          <select id="city">

            <option value="">
              Select City
            </option>

            <option>Lahore</option>
            <option>Islamabad</option>
            <option>Rawalpindi</option>
            <option>Karachi</option>
            <option>Faisalabad</option>
            <option>Multan</option>
            <option>Gujranwala</option>
            <option>Sialkot</option>
            <option>Peshawar</option>
            <option>Other</option>

          </select>

        </div>


        <div class="field">

          <label>
            Complete Address <span class="required">*</span>
          </label>

          <textarea
            id="address"
            placeholder="House no, street, area, landmark..."
          ></textarea>

        </div>


        <div class="field">

          <label>
            Delivery Instructions
          </label>

          <textarea
            id="instructions"
            placeholder="Optional — e.g. gate par call karein"
          ></textarea>

        </div>

      </div>


      <!-- PAYMENT -->

      <div class="box">

        <h2>💳 Payment Method</h2>


        <label class="payment-option">

          <input
            type="radio"
            name="payment"
            value="cod"
            checked
          >

          <div>

            <div class="payment-title">
              Cash on Delivery
            </div>

            <div class="payment-description">
              Order receive karte waqt cash payment karein.
            </div>

          </div>

        </label>


        <label class="payment-option">

          <input
            type="radio"
            name="payment"
            value="easypaisa"
          >

          <div>

            <div class="payment-title">
              EasyPaisa
            </div>

            <div class="payment-description">
              EasyPaisa payment option — details order confirmation par.
            </div>

          </div>

        </label>


        <label class="payment-option">

          <input
            type="radio"
            name="payment"
            value="jazzcash"
          >

          <div>

            <div class="payment-title">
              JazzCash
            </div>

            <div class="payment-description">
              JazzCash payment option — details order confirmation par.
            </div>

          </div>

        </label>

      </div>

    </div>


    <!-- ORDER SUMMARY -->

    <aside class="summary">

      <h2>Order Summary</h2>

      <div id="summaryItems"></div>


      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <strong id="subtotal">
          Rs. 0
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Delivery
        </span>

        <strong>
          Free
        </strong>

      </div>


      <div class="summary-row total">

        <span>
          Total
        </span>

        <span id="total">
          Rs. 0
        </span>

      </div>


      <button
        class="place-order"
        onclick="placeOrder()"
      >
        Place Order →
      </button>


      <div class="secure">
        🔒 Your order details are handled securely.
      </div>

    </aside>

  </div>

</main>


<script>

  let cart =
    JSON.parse(
      localStorage.getItem("grostoCart")
    ) || [];


  function renderSummary() {

    const container =
      document.getElementById("summaryItems");

    let subtotal = 0;

    container.innerHTML = "";


    cart.forEach(item => {

      const itemTotal =
        item.price * item.quantity;

      subtotal += itemTotal;


      const div =
        document.createElement("div");

      div.className = "summary-item";

      div.innerHTML = `

        <span>
          ${item.name} × ${item.quantity}
        </span>

        <strong>
          Rs. ${itemTotal}
        </strong>

      `;

      container.appendChild(div);

    });


    document.getElementById("subtotal")
      .textContent = "Rs. " + subtotal;

    document.getElementById("total")
      .textContent = "Rs. " + subtotal;

  }


  function placeOrder() {

    if (cart.length === 0) {

      alert(
        "Aapka cart empty hai. Pehle products add karein."
      );

      window.location.href = "shop.html";

      return;
    }


    const name =
      document.getElementById("name").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const city =
      document.getElementById("city").value;

    const address =
      document.getElementById("address").value.trim();

    const instructions =
      document.getElementById("instructions").value.trim();


    if (!name || !phone || !city || !address) {

      alert(
        "Please apni required delivery details complete karein."
      );

      return;
    }


    const payment =
      document.querySelector(
        'input[name="payment"]:checked'
      ).value;


    const orderNumber =
      "GR" +
      Date.now().toString().slice(-8);


    const order = {

      orderNumber: orderNumber,

      customer: {
        name: name,
        phone: phone,
        city: city,
        address: address,
        instructions: instructions
      },

      payment: payment,

      items: cart,

      total: cart.reduce(
        (sum, item) =>
          sum + (item.price * item.quantity),
        0
      ),

      status: "Pending",

      createdAt:
        new Date().toISOString()

    };


    localStorage.setItem(
      "grostoLastOrder",
      JSON.stringify(order)
    );


    localStorage.removeItem("grostoCart");


    window.location.href =
      "order-success.html";

  }


  renderSummary();

</script>

</body>
</html>
