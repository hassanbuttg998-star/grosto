<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Confirmed - GROSTO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button, a, input, select, textarea {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus, a:focus {
      outline: none;
    }

    :root {
      --green: #1EAF59;
      --yellow: #FFB300;
      --light-green: #E8F5EC;
      --gray: #666;
      --border: #E2E5E3;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8f7;
      color: #000;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .header {
      max-width: 1100px;
      margin: auto;
      padding: 15px 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      color: var(--green);
      text-decoration: none;
    }

    .logo span {
      color: var(--yellow);
    }

    .container {
      max-width: 650px;
      margin: 45px auto;
      padding: 0 15px;
    }

    .success-box {
      background: #fff;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .success-icon {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--light-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .message {
      color: var(--gray);
      margin-bottom: 25px;
    }

    .order-id {
      background: var(--light-green);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .order-id small {
      display: block;
      color: var(--gray);
      margin-bottom: 5px;
    }

    .order-id strong {
      color: var(--green);
      font-size: 23px;
    }

    .details {
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .detail-row span:first-child {
      color: var(--gray);
    }

    .items {
      text-align: left;
      margin-top: 20px;
    }

    .items h3 {
      margin-bottom: 10px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
    }

    .total {
      border-top: 2px solid var(--border);
      margin-top: 10px;
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 19px;
      font-weight: 900;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }

    .button {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
    }

    .primary {
      background: var(--green);
      color: #fff;
    }

    .secondary {
      border: 1px solid var(--border);
      color: #000;
      background: #fff;
    }

    .whatsapp-btn {
      background: #25D366;
      color: #fff;
    }

    @media (max-width: 550px) {

      .container {
        margin: 25px auto;
      }

      .success-box {
        padding: 30px 18px;
      }

      h1 {
        font-size: 25px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header">

    <a href="index.html" class="logo">
      GROST<span>O</span>
    </a>

  </div>

</header>


<main class="container">

  <div class="success-box">

    <div class="success-icon">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1EAF59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 10 18 20 6"></polyline></svg>
    </div>

    <h1>
      Order Successfully Placed!
    </h1>

    <p class="message">
      Thank you for shopping with GROSTO.
      Aapka order receive ho gaya hai.
    </p>


    <div class="order-id">

      <small>
        Your Order ID
      </small>

      <strong id="orderNumber">
        -
      </strong>

    </div>


    <div class="details">

      <div class="detail-row">

        <span>
          Customer
        </span>

        <strong id="customerName">
          -
        </strong>

      </div>


      <div class="detail-row">

        <span>
          City
        </span>

        <strong id="city">
          -
        </strong>

      </div>


      <div class="detail-row">

        <span>
          Payment
        </span>

        <strong id="payment">
          -
        </strong>

      </div>


      <div class="detail-row">

        <span>
          Status
        </span>

        <strong>
          Pending
        </strong>

      </div>

    </div>


    <div class="items">

      <h3>
        Order Items
      </h3>

      <div id="itemsList"></div>

      <div class="detail-row" id="subtotalRow" style="display:none;">
        <span>Subtotal</span>
        <strong id="orderSubtotal">Rs. 0</strong>
      </div>

      <div class="detail-row" id="deliveryRow" style="display:none;">
        <span>Delivery</span>
        <strong id="orderDelivery">Rs. 0</strong>
      </div>

      <div class="total">

        <span>
          Total
        </span>

        <span id="total">
          Rs. 0
        </span>

      </div>

    </div>


    <div class="buttons" id="whatsappRow" style="display:none; margin-bottom: 10px;">

      <a
        href="#"
        id="whatsappBtn"
        class="button whatsapp-btn"
        target="_blank"
        style="display:flex;align-items:center;justify-content:center;gap:8px;"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="7 12.5 10.5 16 17 9"></polyline></svg> Confirm Order
      </a>

    </div>

    <div class="buttons">

      <a
        href="shop.html"
        class="button primary"
      >
        Continue Shopping
      </a>

      <a
        href="index.html"
        class="button secondary"
      >
        Home
      </a>

    </div>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/site-extras.js"></script>

<script>

  applySiteLogo();

  const order =
    JSON.parse(
      localStorage.getItem("grostoLastOrder")
    );


  if (!order) {

    document.querySelector(".success-box").innerHTML = `

      <div class="success-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1EAF59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 8H6"></path></svg>
      </div>

      <h1>
        No Order Found
      </h1>

      <p class="message">
        Humein recent order details nahi mili.
      </p>

      <a
        href="shop.html"
        class="button primary"
        style="display:inline-block;"
      >
        Start Shopping
      </a>

    `;

  } else {

    document.getElementById("orderNumber")
      .textContent = order.orderNumber;

    document.getElementById("customerName")
      .textContent = order.customer.name;

    document.getElementById("city")
      .textContent = order.customer.city;


    const paymentNames = {

      cod: "Cash on Delivery",

      easypaisa: "EasyPaisa",

      jazzcash: "JazzCash"

    };


    document.getElementById("payment")
      .textContent =
        paymentNames[order.payment] ||
        order.payment;


    const itemsList =
      document.getElementById("itemsList");


    order.items.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "item";

      div.innerHTML = `

        <span>
          ${item.name} x ${item.quantity}
        </span>

        <strong>
          Rs. ${item.price * item.quantity}
        </strong>

      `;

      itemsList.appendChild(div);

    });


    document.getElementById("total")
      .textContent =
        "Rs. " + order.total;

    if (order.subtotal !== undefined && order.deliveryFee !== undefined) {

      document.getElementById("orderSubtotal").textContent = "Rs. " + order.subtotal;
      document.getElementById("orderDelivery").textContent = "Rs. " + order.deliveryFee;

      document.getElementById("subtotalRow").style.display = "flex";
      document.getElementById("deliveryRow").style.display = "flex";
    }


    // Show a WhatsApp confirm button as a fallback,
    // in case the automatic WhatsApp tab was blocked by the browser.
    getGrostoSettings().then(settings => {

      const whatsappNumber =
        (settings.whatsapp_number || "").replace(/\D/g, "");

      if (!whatsappNumber) return;

      let msg = `Order Confirm - GROSTO\n`;
      msg += `Order #: ${order.orderNumber}\n`;
      msg += `Name: ${order.customer.name}\n`;
      msg += `Total: Rs. ${order.total}`;

      const link =
        `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`;

      const btn = document.getElementById("whatsappBtn");

      btn.href = link;

      document.getElementById("whatsappRow").style.display = "flex";

    });

  }

</script>

</body>
</html>
