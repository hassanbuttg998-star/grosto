<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>All Categories - GROSTO</title>
  <meta name="description" content="Browse all GROSTO categories - groceries, household, personal care and more.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button, a, input, select, textarea {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus, a:focus {
      outline: none;
    }

    :root {
      --green: #1EAF59;
      --yellow: #FFB300;
      --white: #FFFFFF;
      --black: #000000;
      --light-green: #E8F5EC;
      --light-gray: #F7F8F7;
      --gray: #666666;
      --border: #E3E6E4;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--black);
      line-height: 1.5;
    }

    a { text-decoration: none; color: inherit; }
    button { font: inherit; cursor: pointer; }
    input { font: inherit; }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: var(--green);
      white-space: nowrap;
    }

    .logo span { color: var(--yellow); }

    .search-box { flex: 1; position: relative; }

    .search-box input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 45px 13px 16px;
      outline: none;
      background: var(--light-gray);
    }

    .search-box input:focus {
      border-color: var(--green);
      background: var(--white);
    }

    .search-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
    }

    .menu-btn {
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--white);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .header-cart-btn {
      position: relative;
      display: flex;
      margin-left: auto;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--white);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      color: #000;
      flex-shrink: 0;
    }

    .cart-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--yellow);
      color: #000;
      font-size: 11px;
      font-weight: 900;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }

    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 2000;
    }

    .menu-overlay.show {
      display: block;
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 78%;
      max-width: 300px;
      background: var(--white);
      z-index: 2001;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      box-shadow: -8px 0 30px rgba(0,0,0,0.18);
      padding: 18px 0;
      overflow-y: auto;
    }

    .mobile-menu.show {
      transform: translateX(0);
    }

    .mobile-menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 16px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .mobile-menu-head span {
      font-weight: 900;
      font-size: 17px;
    }

    .mobile-menu-close {
      border: none;
      background: var(--light-gray);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
    }

    .mobile-menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      color: #222;
      font-weight: 700;
      font-size: 15px;
    }

    .mobile-menu a:hover,
    .mobile-menu a:active {
      background: var(--light-green);
      color: var(--green);
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 12px;
      display: flex;
      gap: 22px;
    }

    .nav a {
      color: #444;
      font-size: 14px;
      font-weight: 600;
    }

    .nav a:hover { color: var(--green); }

    /* ================= PAGE ================= */

    .wrap {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .page-title {
      font-size: 34px;
      margin-bottom: 6px;
    }

    .page-subtitle {
      color: var(--gray);
      margin-bottom: 26px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .cat-card {
      position: relative;
      background: var(--light-gray);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
      transition: 0.2s;
    }

    .cat-card:hover {
      transform: translateY(-3px);
      border-color: var(--green);
    }

    .cat-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 12px;
      overflow: hidden;
    }

    .cat-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cat-name {
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .cat-count {
      color: var(--gray);
      font-size: 12px;
    }

    .cat-soon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--yellow);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 6px;
    }

    footer {
      background: #111;
      color: #bbb;
      text-align: center;
      padding: 22px;
      font-size: 13px;
      margin-top: 40px;
    }

    @media (max-width: 700px) {

      .header-inner {
        padding: 11px 14px;
        flex-wrap: wrap;
      }

      .logo { font-size: 25px; }

      .search-box { order: 3; flex-basis: 100%; }

      .menu-btn { display: flex; }

      .nav { display: none; }

      .wrap { padding: 20px 14px 50px; }

      .page-title { font-size: 26px; }

      .cat-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .cat-card { padding: 18px 10px; }

      .cat-icon {
        width: 54px;
        height: 54px;
        font-size: 26px;
      }

      .cat-name { font-size: 13px; }
    }
  </style>
</head>

<body>

  <header>

    <div class="header-inner">

      <a href="index.html" class="logo">GROST<span>O</span></a>

      <div class="search-box">
        <input
          type="search"
          id="searchInput"
          placeholder="Aap kya dhoond rahe hain?"
          aria-label="Search products"
          onkeydown="if(event.key==='Enter') goToSearch()"
        >
        <span class="search-icon">&#128270;</span>
      </div>

      <button class="header-cart-btn" onclick="openCart()" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7h12l1.2 13.1a1 1 0 0 1-1 1.1H5.8a1 1 0 0 1-1-1.1L6 7z"></path>
          <path d="M9 10V6a3 3 0 0 1 6 0v4"></path>
        </svg>
        <span class="cart-badge" id="headerCartBadge">0</span>
      </button>

      <button class="menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
        <svg width="20" height="15" viewBox="0 0 20 15" fill="none">
          <rect x="0" y="0" width="20" height="2.2" rx="1.1" fill="currentColor"></rect>
          <rect x="0" y="6.4" width="14" height="2.2" rx="1.1" fill="currentColor"></rect>
          <rect x="0" y="12.8" width="8" height="2.2" rx="1.1" fill="currentColor"></rect>
        </svg>
      </button>

      <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-head">
        <span>Menu</span>
        <button class="mobile-menu-close" onclick="closeMobileMenu()" aria-label="Close">&times;</button>
        </div>
        <a href="index.html">&#127968; Home</a>
        <a href="shop.html">&#128717;&#65039; Shop</a>
        <a href="categories.html">&#128193; Categories</a>
        <a href="index.html#deals">&#128293; Deals</a>
        <a href="cart.html">&#128722; My Cart</a>
      </div>

      <div class="menu-overlay" id="menuOverlay" onclick="closeMobileMenu()"></div>

    </div>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="index.html#deals">Deals</a>
    </nav>

  </header>


  <main class="wrap">

    <h1 class="page-title">All Categories</h1>
    <p class="page-subtitle">Jo bhi chahiye, category se seedha dhoondein.</p>

    <div class="cat-grid" id="catGrid"></div>

  </main>

  <footer>&#169; 2026 GROSTO. All rights reserved.</footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/site-extras.js"></script>
  <script src="js/categories.js"></script>

  <script>

    var cart = JSON.parse(localStorage.getItem("grostoCart")) || [];

    function updateCartCount() {

      var count = cart.reduce(function (t, i) { return t + i.quantity; }, 0);

      document.getElementById("headerCartBadge").textContent = count;
    }

    function openCart() {

      cart = JSON.parse(localStorage.getItem("grostoCart")) || [];

      if (cart.length === 0) {
        alert("Aapka cart abhi empty hai.");
        return;
      }

      window.location.href = "cart.html";
    }

    function toggleMobileMenu() {
      document.getElementById("mobileMenu").classList.toggle("show");
      document.getElementById("menuOverlay").classList.toggle("show");
    }

    function closeMobileMenu() {
      document.getElementById("mobileMenu").classList.remove("show");
      document.getElementById("menuOverlay").classList.remove("show");
    }

    document.addEventListener("click", function (e) {

      var menu = document.getElementById("mobileMenu");
      var btn = document.querySelector(".menu-btn");

      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove("show");
      }
    });

    function goToSearch() {

      var q = document.getElementById("searchInput").value.trim();

      window.location.href = "shop.html" + (q ? "?q=" + encodeURIComponent(q) : "");
    }

    async function loadCategoryCounts() {

      var counts = {};

      try {

        var res = await grostoDB.from("products").select("category").eq("is_active", true);

        (res.data || []).forEach(function (p) {
          counts[p.category] = (counts[p.category] || 0) + 1;
        });

      } catch (e) {
        console.error(e);
      }

      var imageMap = (typeof window.loadCategoryImages === "function") ? await window.loadCategoryImages() : {};

      var grid = document.getElementById("catGrid");

      var categoryList = window.GROSTO_CATEGORIES || [];

      if (!categoryList.length) {

        grid.innerHTML = '<div class="hint">Categories load nahi ho sakin. Page ko refresh karein.</div>';

        return;
      }

      grid.innerHTML = categoryList.map(function (c) {

        var count = counts[c.value] || 0;

        return '<a class="cat-card" href="shop.html?cat=' + encodeURIComponent(c.value) + '">' +
          (count === 0 ? '<span class="cat-soon">Coming Soon</span>' : '') +
          '<div class="cat-icon">' + (typeof window.categoryIconHtml === "function" ? window.categoryIconHtml(c, imageMap) : c.icon) + '</div>' +
          '<div class="cat-name">' + c.label + '</div>' +
          '<div class="cat-count">' + (count === 0 ? "Jald aa raha hai" : (count + " product" + (count > 1 ? "s" : ""))) + '</div>' +
        '</a>';

      }).join("");
    }

    updateCartCount();
    if (typeof initSearchSuggest === "function") initSearchSuggest("searchInput");
    if (typeof initWhatsAppFloat === "function") initWhatsAppFloat();
    if (typeof applySiteLogo === "function") applySiteLogo();
    loadCategoryCounts();

  </script>

</body>
</html>
